class TTSProviderBase(ABC):
    def __init__(self, config, delete_audio_file):
        self._cfg_tts = config or {}
        self.interface_type = InterfaceType.NON_STREAM
        self.conn = None
        self.delete_audio_file = delete_audio_file
        self.audio_file_type = "wav"
        self.output_file = config.get("output_dir", "tmp/")
        self.tts_timeout = float(config.get("tts_timeout", 15))
        if not math.isfinite(self.tts_timeout) or self.tts_timeout <= 0:
            raise ValueError("tts_timeout must be a positive finite number")
        self.tts_text_queue = queue.Queue()
        self.tts_audio_queue = queue.Queue()
        self.tts_audio_first_sentence = True
        self.before_stop_play_files = []
        self.report_on_last = False
        # sentence_id 到文本的映射，用于流式TTS获取正确的字幕文本
        self._sentence_text_map = {}
        # 加载替换词，用于一次性正则替换
        raw_words = config.get("correct_words", [])
        self.correct_words = {}
        for item in raw_words:
            parts = item.split("|", 1)
            if len(parts) == 2:
                self.correct_words[parts[0]] = parts[1]
        # 构建正则表达式，使用最长匹配优先（排序后转义拼接）
        if self.correct_words:
            # 按key长度降序排列，长的先匹配，避免短词部分干扰
            sorted_keys = sorted(self.correct_words.keys(), key=len, reverse=True)
            pattern_str = "|".join(re.escape(k) for k in sorted_keys)
            self._correct_words_pattern = re.compile(pattern_str)
            # 构建反向替换正则，用于将TTS服务返回的替换后文本还原为原始文本（字幕显示）
            reverse_map = {v: k for k, v in self.correct_words.items()}
            sorted_reverse_keys = sorted(reverse_map.keys(), key=len, reverse=True)
            reverse_pattern_str = "|".join(re.escape(k) for k in sorted_reverse_keys)
            self._reverse_words_pattern = re.compile(reverse_pattern_str)
            self._reverse_words_map = reverse_map
            # 流式滑动窗口：按首字分组的替换词字典，用于快速查找
            self._words_by_first_char = {}
            for key in sorted_keys:  # 使用已按长度降序排列的keys，确保长词优先匹配
                first_char = key[0] if key else ""
                if first_char not in self._words_by_first_char:
                    self._words_by_first_char[first_char] = []
                self._words_by_first_char[first_char].append(key)
        else:
            self._correct_words_pattern = None
            self._reverse_words_pattern = None
            self._reverse_words_map = None

        # 流式滑动窗口：待匹配的缓存文本
        self._pending_prefix = ""
        self.tts_text_buff = []
        self.punctuations = (
            "。",
            "？",
            "?",
            "！",
            "!",
            "；",
            ";",
            "：",
        )
        self.first_sentence_punctuations = (
            "，",
            "~",
            "、",
            ",",
            "。",
            "？",
            "?",
            "！",
            "!",
            "；",
            ";",
            "：",
        )
        self.tts_stop_request = False
        self.processed_chars = 0
        self.is_first_sentence = True

    def generate_filename(self, extension=".wav"):
        return os.path.join(
            self.output_file,
            f"tts-{datetime.now().date()}@{uuid.uuid4().hex}{extension}",
        )

    def handle_opus(self, opus_data: bytes):
        logger.bind(tag=TAG).debug(f"推送数据到队列里面帧数～～ {len(opus_data)}")
        self.tts_audio_queue.put((SentenceType.MIDDLE, opus_data, None, getattr(self, 'current_sentence_id', None)))

    def handle_audio_file(self, file_audio: bytes, text):
        self.before_stop_play_files.append((file_audio, text))

    # --- Automakaza: nível da voz medido para igualar o volume das rádios ---
    _voz_lufs = []          # medidas das últimas frases (compartilhado)
    _VOZ_MAX_MEDIDAS = 15

    def _medir_voz(self, audio: bytes, fmt: str) -> None:
        """Mede o volume (LUFS) da voz em segundo plano, sem atrasar a fala."""
        cls = TTSProviderBase
        if not audio or len(cls._voz_lufs) >= cls._VOZ_MAX_MEDIDAS:
            return

        def medir():
            import re as _re
            import subprocess

            try:
                r = subprocess.run(
                    ["ffmpeg", "-nostdin", "-hide_banner", "-f", fmt or "mp3", "-i", "pipe:0",
                     "-af", "ebur128", "-f", "null", "-"],
                    input=audio, capture_output=True, timeout=20,
                )
                txt = r.stderr.decode("utf-8", "ignore")
                m = _re.findall(r"I:\s*(-?\d+(?:\.\d+)?)\s*LUFS", txt)
                if m:
                    v = float(m[-1])
                    if -60 < v < -3:
                        cls._voz_lufs.append(v)
                        logger.bind(tag=TAG).debug(f"Voz medida: {v:.1f} LUFS")
            except Exception as e:
                logger.bind(tag=TAG).debug(f"Não medi a voz: {e}")

        threading.Thread(target=medir, daemon=True).start()

    @classmethod
    def nivel_da_voz(cls):
        """Mediana das medidas da voz (LUFS) ou None se ainda não mediu."""
        if not cls._voz_lufs:
            return None
        v = sorted(cls._voz_lufs)
        return v[len(v) // 2]

    # --- Automakaza: voz gerada em paralelo -------------------------------
    # O EdgeTTS leva 1,5 a 3 s por trecho. Antes, um trecho só começava a ser
    # gerado depois do anterior, e sobrava silêncio entre as frases. Agora cada
    # trecho começa a ser gerado assim que o texto chega (até 3 ao mesmo
    # tempo), e uma fila toca tudo na ordem certa.
    TTS_PARALELO = 3

    def _iniciar_ordem(self):
        from concurrent.futures import ThreadPoolExecutor

        self._ordem = queue.Queue()
        self._pool = ThreadPoolExecutor(max_workers=self.TTS_PARALELO, thread_name_prefix="tts")
        self._ordem_thread = threading.Thread(target=self._ordem_loop, daemon=True)
        self._ordem_thread.start()

    # Frases curtas já prontas (avisos "deixa eu ver..."): geradas uma vez e
    # guardadas, para sair na hora em vez de esperar 1,5 s do EdgeTTS.
    _cache_frases = {}

    def _chave_frase(self, frase):
        return (getattr(self, "voice", ""), frase)

    def _gerar_e_guardar(self, frase):
        audio = self._gerar_audio(frase, f"(aviso guardado) {frase}")
        if audio:
            TTSProviderBase._cache_frases[self._chave_frase(frase)] = audio
        return audio

    _preparo_pool = None          # 1 tarefa por vez, separada da fala
    _preparando = set()

    def preaquecer_frases(self, frases):
        """Gera em segundo plano, uma de cada vez e sem atrapalhar a conversa,
        as frases que ainda não estão guardadas."""
        from concurrent.futures import ThreadPoolExecutor

        cls = TTSProviderBase
        if cls._preparo_pool is None:
            cls._preparo_pool = ThreadPoolExecutor(max_workers=1, thread_name_prefix="tts-prep")
        for frase in dict.fromkeys((f or "").strip() for f in frases):
            chave = self._chave_frase(frase)
            if not frase or chave in cls._cache_frases or chave in cls._preparando:
                continue
            cls._preparando.add(chave)

            def tarefa(f=frase, k=chave):
                try:
                    # se uma conversa está gerando voz agora, espera ela acabar
                    for _ in range(100):
                        if getattr(self, "_ordem", None) is None or self._ordem.empty():
                            break
                        import time as _t
                        _t.sleep(0.2)
                    self._gerar_e_guardar(f)
                finally:
                    cls._preparando.discard(k)

            cls._preparo_pool.submit(tarefa)

    def falar_pronto(self, frase):
        """Fala uma frase curta já, usando o áudio guardado quando existir."""
        from concurrent.futures import Future

        frase = (frase or "").strip()
        if not frase:
            return
        if getattr(self, "_ordem", None) is None:
            self.tts_one_sentence(self.conn, ContentType.TEXT, content_detail=frase + "\n")
            return
        audio = self._cache_frases.get(self._chave_frase(frase))
        if audio:
            fut = Future()
            fut.set_result(audio)
        else:
            fut = self._pool.submit(self._gerar_e_guardar, frase)
        self._ordem.put(("seg", fut, frase, self.conn.sentence_id, None))

    def _ordenar(self, fn, sid=None):
        """Executa fn na fila de saída, depois dos trechos de voz já pedidos."""
        if getattr(self, "_ordem", None) is None:
            fn()
            return
        self._ordem.put(("call", fn, sid))

    def _gerar_audio(self, text, original_text):
        for tentativa in range(5):
            try:
                audio = asyncio.run(self.text_to_speak(text, None))
                if audio:
                    logger.bind(tag=TAG).info(f"语音生成成功: {original_text}，重试{tentativa}次")
                    return audio
            except Exception as e:
                logger.bind(tag=TAG).warning(
                    f"语音生成失败{tentativa + 1}次: {original_text}，错误: {e}"
                )
        logger.bind(tag=TAG).error(f"语音生成失败: {original_text}，请检查网络或服务是否正常")
        return None

    def _ordem_loop(self):
        while not self.conn.stop_event.is_set():
            try:
                item = self._ordem.get(timeout=1)
            except queue.Empty:
                continue
            try:
                if item[0] == "seg":
                    _, fut, original_text, sid, handler = item
                    audio = fut.result(timeout=60)
                    if self.conn.client_abort or sid != self.conn.sentence_id or not audio:
                        continue
                    self._medir_voz(audio, self.audio_file_type)
                    self.tts_audio_queue.put((SentenceType.FIRST, None, original_text, sid))
                    if handler is None or handler == self.handle_opus:
                        # marca os quadros com a resposta a que pertencem
                        handler = lambda d, _sid=sid: self.tts_audio_queue.put(
                            (SentenceType.MIDDLE, d, None, _sid)
                        )
                    audio_bytes_to_data_stream(
                        audio,
                        file_type=self.audio_file_type,
                        is_opus=True,
                        callback=handler,
                        sample_rate=self.conn.sample_rate,
                        opus_encoder=self.opus_encoder,
                    )
                elif item[0] == "stream":
                    _, chq, original_text, sid, handler = item
                    if self.conn.client_abort or sid != self.conn.sentence_id:
                        continue
                    if handler is None or handler == self.handle_opus:
                        handler = lambda d, _sid=sid: self.tts_audio_queue.put(
                            (SentenceType.MIDDLE, d, None, _sid)
                        )
                    self._tocar_stream(chq, original_text, sid, handler)
                else:
                    _, fn, sid = item
                    if sid is not None and sid != self.conn.sentence_id:
                        continue
                    fn()
            except Exception as e:
                logger.bind(tag=TAG).error(
                    f"Fila de voz: {e} {traceback.format_exc()}"
                )

    def to_tts_stream(self, text, opus_handler: Callable[[bytes], None] = None) -> None:
        if not self.delete_audio_file or getattr(self, "_ordem", None) is None:
            return self._to_tts_stream_seq(text, opus_handler)
        original_text = text
        text = MarkdownCleaner.clean_markdown(text)
        if self._correct_words_pattern:
            text = self._correct_words_pattern.sub(lambda m: self.correct_words[m.group(0)], text)
        sid = getattr(self, "current_sentence_id", None)
        if self._pode_streaming():
            # EdgeTTS em streaming: toca à medida que o áudio chega
            chq = queue.Queue()
            self._pool.submit(self._gerar_stream, text, original_text, chq)
            self._ordem.put(("stream", chq, original_text, sid, opus_handler))
            return None
        fut = self._pool.submit(self._gerar_audio, text, original_text)
        self._ordem.put(("seg", fut, original_text, sid, opus_handler))
        return None

    # --- Automakaza: EdgeTTS em streaming -----------------------------------
    def _pode_streaming(self):
        if getattr(self, "_streaming_off", False):
            return False
        if not hasattr(self, "edge_rate") or self.audio_file_type != "mp3":
            return False
        if getattr(self.conn, "audio_format", "opus") == "pcm" or self.opus_encoder is None:
            return False
        return str(self._cfg_tts.get("streaming", False)).lower() in ("true", "1", "yes")

    def _gerar_stream(self, text, original_text, chq):
        """Produtor: pede ao EdgeTTS e repassa cada pedaço de MP3 que chega."""
        import edge_tts

        async def rodar():
            com = edge_tts.Communicate(
                text, voice=self.voice, rate=self.edge_rate,
                volume=self.edge_volume, pitch=self.edge_pitch,
            )
            n = 0
            async for ch in com.stream():
                if ch.get("type") == "audio" and ch.get("data"):
                    chq.put(ch["data"])
                    n += 1
            return n

        for tentativa in range(3):
            try:
                if asyncio.run(rodar()) > 0:
                    break
            except Exception as e:
                logger.bind(tag=TAG).warning(
                    f"语音生成失败{tentativa + 1}次 (stream): {original_text}，错误: {e}"
                )
                if not chq.empty():
                    break  # já tocou uma parte: não repete
        chq.put(None)

    def _tocar_stream(self, chq, original_text, sid, handler):
        """Consumidor (fila de saída): MP3 em pedaços -> ffmpeg -> PCM -> Opus."""
        import subprocess
        import time as _time

        conn = self.conn
        sr = conn.sample_rate
        cmd = [
            "ffmpeg", "-nostdin", "-loglevel", "error",
            "-probesize", "32", "-analyzeduration", "0", "-fflags", "nobuffer",
            "-f", "mp3", "-i", "pipe:0",
            "-f", "s16le", "-ac", "1", "-ar", str(sr), "pipe:1",
        ]
        proc = subprocess.Popen(
            cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
        )
        mp3 = bytearray()
        estado = {"ok": True}

        def escrever():
            try:
                while True:
                    try:
                        dado = chq.get(timeout=20)
                    except queue.Empty:
                        estado["ok"] = False
                        break
                    if dado is None:
                        break
                    mp3.extend(dado)
                    proc.stdin.write(dado)
                    proc.stdin.flush()
            except Exception:
                pass
            finally:
                try:
                    proc.stdin.close()
                except Exception:
                    pass

        threading.Thread(target=escrever, daemon=True).start()
        t0 = _time.monotonic()
        primeiro = True
        frame_bytes = int(sr * 0.06) * 2
        try:
            while True:
                if conn.client_abort or sid != conn.sentence_id or conn.stop_event.is_set():
                    break
                pcm = proc.stdout.read(frame_bytes * 16 if primeiro else frame_bytes)  # ~1 s de folga no início
                if not pcm:
                    break
                if primeiro:
                    primeiro = False
                    self.tts_audio_queue.put((SentenceType.FIRST, None, original_text, sid))
                    logger.bind(tag=TAG).debug(
                        f"Voz em streaming: primeiro áudio em {_time.monotonic() - t0:.2f}s"
                    )
                self.opus_encoder.encode_pcm_to_opus_stream(pcm, False, handler)
            self.opus_encoder.encode_pcm_to_opus_stream(b"", True, handler)
        finally:
            try:
                proc.kill()
            except Exception:
                pass
        if mp3:
            logger.bind(tag=TAG).info(f"语音生成成功: {original_text}，重试0次 (streaming)")
            try:
                self._medir_voz(bytes(mp3), "mp3")
            except Exception:
                pass
        elif primeiro:
            logger.bind(tag=TAG).error(f"语音生成失败: {original_text} (streaming)")

    def _to_tts_stream_seq(self, text, opus_handler: Callable[[bytes], None] = None) -> None:
        # 保留原始文本用于显示/上报
        original_text = text
        text = MarkdownCleaner.clean_markdown(text)
        # 使用正则一次性替换，避免重复遍历和部分匹配问题
        if self._correct_words_pattern:
            text = self._correct_words_pattern.sub(lambda m: self.correct_words[m.group(0)], text)
        max_repeat_time = 5
        if self.delete_audio_file:
            # 需要删除文件的直接转为音频数据
            while max_repeat_time > 0:
                try:
                    audio_bytes = asyncio.run(self.text_to_speak(text, None))
                    if audio_bytes:
                        self._medir_voz(audio_bytes, self.audio_file_type)
                        # 使用原始文本用于显示/上报
                        self.tts_audio_queue.put((SentenceType.FIRST, None, original_text, getattr(self, 'current_sentence_id', None)))
                        audio_bytes_to_data_stream(
                            audio_bytes,
                            file_type=self.audio_file_type,
                            is_opus=True,
                            callback=opus_handler,
                            sample_rate=self.conn.sample_rate,
                            opus_encoder=self.opus_encoder,
                        )
                        break
                    else:
                        max_repeat_time -= 1
                except Exception as e:
                    logger.bind(tag=TAG).warning(
                        f"语音生成失败{5 - max_repeat_time + 1}次: {original_text}，错误: {e}"
                    )
                    max_repeat_time -= 1
            if max_repeat_time > 0:
                logger.bind(tag=TAG).info(
                    f"语音生成成功: {original_text}，重试{5 - max_repeat_time}次"
                )
            else:
                logger.bind(tag=TAG).error(
                    f"语音生成失败: {original_text}，请检查网络或服务是否正常"
                )
            return None
        else:
            tmp_file = self.generate_filename()
            try:
                while not os.path.exists(tmp_file) and max_repeat_time > 0:
                    try:
                        asyncio.run(self.text_to_speak(text, tmp_file))
                    except Exception as e:
                        logger.bind(tag=TAG).warning(
                            f"语音生成失败{5 - max_repeat_time + 1}次: {original_text}，错误: {e}"
                        )
                        # 未执行成功，删除文件
                        if os.path.exists(tmp_file):
                            os.remove(tmp_file)
                        max_repeat_time -= 1

                if max_repeat_time > 0:
                    logger.bind(tag=TAG).info(
                        f"语音生成成功: {original_text}:{tmp_file}，重试{5 - max_repeat_time}次"
                    )
                else:
                    logger.bind(tag=TAG).error(
                        f"语音生成失败: {original_text}，请检查网络或服务是否正常"
                    )
                if os.path.exists(tmp_file):
                    try:
                        with open(tmp_file, "rb") as _f:
                            self._medir_voz(_f.read(), self.audio_file_type)
                    except Exception:
                        pass
                self.tts_audio_queue.put((SentenceType.FIRST, None, original_text, getattr(self, 'current_sentence_id', None)))
                self._process_audio_file_stream(tmp_file, callback=opus_handler)
            except Exception as e:
                logger.bind(tag=TAG).error(f"Failed to generate TTS file: {e}")
                return None
    
    def to_tts(self, text):
        # 保留原始文本用于日志/显示
        original_text = text
        text = MarkdownCleaner.clean_markdown(text)
        if self._correct_words_pattern:
            text = self._correct_words_pattern.sub(lambda m: self.correct_words[m.group(0)], text)
        max_repeat_time = 5
        if self.delete_audio_file:
            # 需要删除文件的直接转为音频数据
            while max_repeat_time > 0:
                try:
                    audio_bytes = asyncio.run(self.text_to_speak(text, None))
                    if audio_bytes:
                        audio_datas = []
                        audio_bytes_to_data_stream(
                            audio_bytes,
                            file_type=self.audio_file_type,
                            is_opus=True,
                            callback=lambda data: audio_datas.append(data),
                            sample_rate=self.conn.sample_rate,
                        )
                        return audio_datas
                    else:
                        max_repeat_time -= 1
                except Exception as e:
                    logger.bind(tag=TAG).warning(
                        f"语音生成失败{5 - max_repeat_time + 1}次: {original_text}，错误: {e}"
                    )
                    max_repeat_time -= 1
            if max_repeat_time > 0:
                logger.bind(tag=TAG).info(
                    f"语音生成成功: {original_text}，重试{5 - max_repeat_time}次"
                )
            else:
                logger.bind(tag=TAG).error(
                    f"语音生成失败: {original_text}，请检查网络或服务是否正常"
                )
            return None
        else:
            tmp_file = self.generate_filename()
            try:
                while not os.path.exists(tmp_file) and max_repeat_time > 0:
                    try:
                        asyncio.run(self.text_to_speak(text, tmp_file))
                    except Exception as e:
                        logger.bind(tag=TAG).warning(
                            f"语音生成失败{5 - max_repeat_time + 1}次: {original_text}，错误: {e}"
                        )
                        # 未执行成功，删除文件
                        if os.path.exists(tmp_file):
                            os.remove(tmp_file)
                        max_repeat_time -= 1

                if max_repeat_time > 0:
                    logger.bind(tag=TAG).info(
                        f"语音生成成功: {original_text}:{tmp_file}，重试{5 - max_repeat_time}次"
                    )
                else:
                    logger.bind(tag=TAG).error(
                        f"语音生成失败: {original_text}，请检查网络或服务是否正常"
                    )

                return tmp_file
            except Exception as e:
                logger.bind(tag=TAG).error(f"Failed to generate TTS file: {e}")
                return None

    @abstractmethod
    async def text_to_speak(self, text, output_file):
        pass

    def audio_to_pcm_data_stream(
        self, audio_file_path, callback: Callable[[Any], Any] = None
    ):
        """音频文件转换为PCM编码"""
        return audio_to_data_stream(audio_file_path, is_opus=False, callback=callback, sample_rate=self.conn.sample_rate, opus_encoder=None)

    def audio_to_opus_data_stream(
        self, audio_file_path, callback: Callable[[Any], Any] = None
    ):
        """音频文件转换为Opus编码"""
        return audio_to_data_stream(audio_file_path, is_opus=True, callback=callback, sample_rate=self.conn.sample_rate, opus_encoder=self.opus_encoder)

    def tts_one_sentence(
        self,
        conn,
        content_type,
        content_detail=None,
        content_file=None,
        sentence_id=None,
    ):
        """发送一句话"""
        if not sentence_id:
            if conn.sentence_id:
                sentence_id = conn.sentence_id
            else:
                sentence_id = str(uuid.uuid4().hex)
                conn.sentence_id = sentence_id
        # 对于单句的文本，进行分段处理
        segments = re.split(r"([。！？!?；;\n])", content_detail)
        for seg in segments:
            self.tts_text_queue.put(
                TTSMessageDTO(
                    sentence_id=sentence_id,
                    sentence_type=SentenceType.MIDDLE,
                    content_type=content_type,
                    content_detail=seg,
                    content_file=content_file,
                )
            )

    async def open_audio_channels(self, conn):
        self.conn = conn

        # 根据conn的sample_rate创建编码器，如果子类已经创建则不覆盖（IndexTTS接口返回为24kHZ-待重采样处理）
        if not hasattr(self, 'opus_encoder') or self.opus_encoder is None:
            self.opus_encoder = opus_encoder_utils.OpusEncoderUtils(
                sample_rate=conn.sample_rate, channels=1, frame_size_ms=60
            )

        # tts 消化线程
        self.tts_priority_thread = threading.Thread(
            target=self.tts_text_priority_thread, daemon=True
        )
        self.tts_priority_thread.start()

        # Automakaza: fila de saída (voz em paralelo, tocada na ordem)
        self._iniciar_ordem()

        # 音频播放 消化线程
        self.audio_play_priority_thread = threading.Thread(
            target=self._audio_play_priority_thread, daemon=True
        )
        self.audio_play_priority_thread.start()

    def store_tts_text(self, sentence_id, text):
        """存储指定 sentence_id 对应的文本，用于流式TTS获取正确的字幕文本

        Args:
            sentence_id: 会话ID
            text: 要存储的文本
        """
        if sentence_id and text:
            self._sentence_text_map[sentence_id] = text
            # 只保留最近 5 个，防止内存泄漏
            if len(self._sentence_text_map) > 5:
                oldest = next(iter(self._sentence_text_map))
                del self._sentence_text_map[oldest]

    def get_tts_text(self, sentence_id):
        """获取指定 sentence_id 对应的文本

        Args:
            sentence_id: 会话ID

        Returns:
            str: 对应的文本，如果不存在返回 None
        """
        return self._sentence_text_map.get(sentence_id)

    def clear_tts_text(self, sentence_id):
        """清除指定 sentence_id 的文本

        Args:
            sentence_id: 会话ID
        """
        if sentence_id in self._sentence_text_map:
            del self._sentence_text_map[sentence_id]

    def _restore_original_text(self, text):
        if not self._reverse_words_pattern or not text:
            return text
        return self._reverse_words_pattern.sub(
            lambda m: self._reverse_words_map[m.group(0)], text
        )

    # 这里默认是非流式的处理方式
    # 流式处理方式请在子类中重写
    def tts_text_priority_thread(self):
        while not self.conn.stop_event.is_set():
            try:
                message = self.tts_text_queue.get(timeout=1)
                if self.conn.client_abort:
                    logger.bind(tag=TAG).info("收到打断信息，终止TTS文本处理线程")
                    continue
                # 过滤旧消息：检查sentence_id是否匹配
                if message.sentence_id != self.conn.sentence_id:
                    continue
                if message.sentence_type == SentenceType.FIRST:
                    self.current_sentence_id = message.sentence_id
                    self.tts_stop_request = False
                    self.processed_chars = 0
                    self.tts_text_buff = []
                    self.is_first_sentence = True
                    self.tts_audio_first_sentence = True
                elif ContentType.TEXT == message.content_type:
                    self.tts_text_buff.append(message.content_detail)
                    segment_text = self._get_segment_text()
                    if segment_text:
                        self.to_tts_stream(segment_text, opus_handler=self.handle_opus)
                elif ContentType.FILE == message.content_type:
                    self._process_remaining_text_stream(opus_handler=self.handle_opus)
                    tts_file = message.content_file
                    if tts_file and (
                        str(tts_file).startswith(("http://", "https://"))
                        or os.path.exists(tts_file)
                    ):
                        self._ordenar(
                            lambda f=tts_file: self._process_audio_file_stream(
                                f, callback=self.handle_opus
                            ),
                            message.sentence_id,
                        )
                if message.sentence_type == SentenceType.LAST:
                    self._process_remaining_text_stream(opus_handler=self.handle_opus)

                    def _fim(m=message):
                        # Automakaza: a rádio foi interrompida por um pedido rápido
                        # (volume, hora...)? Terminada a resposta, volta a tocar.
                        self._sid_fim = m.sentence_id
                        self._retomar_radio_se_preciso()
                        self.tts_audio_queue.put(
                            (m.sentence_type, [], m.content_detail, m.sentence_id)
                        )

                    self._ordenar(_fim, message.sentence_id)

            except queue.Empty:
                continue
            except Exception as e:
                logger.bind(tag=TAG).error(
                    f"处理TTS文本失败: {str(e)}, 类型: {type(e).__name__}, 堆栈: {traceback.format_exc()}"
                )
                continue

    def _audio_play_priority_thread(self):
        # 需要上报的文本和音频列表
        enqueue_text = None
        enqueue_audio = []
        while not self.conn.stop_event.is_set():
            text = None
            try:
                try:
                    item = self.tts_audio_queue.get(timeout=0.1)
                    if len(item) == 4:
                        sentence_type, audio_datas, text, sentence_id = item
                    else:
                        sentence_type, audio_datas, text = item
                        sentence_id = None
                except queue.Empty:
                    if self.conn.stop_event.is_set():
                        break
                    continue

                if self.conn.client_abort:
                    logger.bind(tag=TAG).debug("收到打断信号，跳过当前音频数据")
                    enqueue_text, enqueue_audio = None, []
                    continue

                # 收到下一个文本开始或会话结束时进行上报
                if sentence_type is not SentenceType.MIDDLE:
                    if self.report_on_last:
                        # 累积模式：适用于全程只有一个语音流的TTS（如seed-tts-2.0）
                        # FIRST时只记录文本，音频持续累积，仅在LAST时统一上报
                        if text:
                            enqueue_text = text
                        if sentence_type == SentenceType.LAST:
                            enqueue_tts_report(self.conn, enqueue_text, enqueue_audio)
                            enqueue_audio = []
                            enqueue_text = None
                    else:
                        # 非累积模式：每个句子分别上报
                        if enqueue_text is not None:
                            enqueue_tts_report(self.conn, enqueue_text, enqueue_audio)
                        enqueue_audio = []
                        enqueue_text = text

                # 收集上报音频数据
                if isinstance(audio_datas, bytes):
                    enqueue_audio.append(audio_datas)

                # 发送音频
                future = asyncio.run_coroutine_threadsafe(
                    sendAudioMessage(self.conn, sentence_type, audio_datas, text, sentence_id),
                    self.conn.loop,
                )
                future.result()

                # 记录输出和报告
                if self.conn.max_output_size > 0 and text:
                    add_device_output(self.conn.headers.get("device-id"), len(text))

            except Exception as e:
                logger.bind(tag=TAG).error(f"audio_play_priority_thread: {text} {e}")

    async def start_session(self, session_id):
        pass

    async def finish_session(self, session_id):
        pass

    async def close(self):
        """资源清理方法"""
        self._sentence_text_map.clear()
        if hasattr(self, "ws") and self.ws:
            await self.ws.close()

    # 右引号/右括号，以及它们对应的左侧符号
    _QUOTE_PAIRS = (
        ("「", "」"),
        ("『", "』"),
        ("“", "”"),
        ('"', '"'),
        ("（", "）"),
        ("《", "》"),
        ("«", "»"),
        ("„", "“"),
        ("【", "】"),
        ("〈", "〉"),
        ("［", "］"),
        ("[", "]"),
    )
    # 注意：“（U+201C）有双重语义：中文里是开引号（对应 ”），
    # 德语 „…“ 里是闭引号；二者冲突时计数法无法兼顾，
    # 德语句子的切分只能靠“不平衡就顺延”保守处理（最终由 flush 兜底）。
    _CLOSERS = '」』”》）"»“】〉］]'
    _QUOTE_CHARS = "".join(ch for pair in _QUOTE_PAIRS for ch in pair)

    @classmethod
    def _quote_safe_cut(cls, text: str, pos: int, punctuations) -> int:
        """避免在引号内切分（如 「わぁ！」って / “好！”他说）。

        候选位置之后紧跟的右引号和句末标点一并带走；若候选位于未闭合的引号内，
        或右引号后句子还在继续，则顺延到下一个标点；都不安全时返回 -1，等待更多文本。
        """
        if not any(ch in cls._QUOTE_CHARS for ch in text):
            # 全文不含引号/括号：不存在未闭合引号，右引号也无需携带，候选位置必然安全
            return pos
        candidates = [pos] + [
            i for i, ch in enumerate(text) if i > pos and ch in punctuations
        ]
        for candidate in candidates:
            end = candidate + 1
            carried_closer = False
            while end < len(text) and (
                text[end] in cls._CLOSERS or text[end] in punctuations
            ):
                if text[end] in cls._CLOSERS:
                    carried_closer = True
                end += 1
            segment = text[:end]
            # 前后配对的引号（「」等）用计数差检测；前后同符的引号（"）用奇偶检测
            balanced = True
            for opener, closer in cls._QUOTE_PAIRS:
                n_open = segment.count(opener)
                if opener == closer:
                    if n_open % 2:
                        balanced = False
                        break
                elif n_open > segment.count(closer):
                    balanced = False
                    break
            if not balanced:
                continue
            if carried_closer and (end == len(text) or not text[end].isspace()):
                # 右引号之后句子还在继续（「…」って、“…”他说），或暂时看不到后文
                continue
            return end - 1
        return -1

    # --- Automakaza: trechos maiores para o TTS (evita pausas entre pedacinhos) ---
    # O EdgeTTS leva ~1,5-2,5 s para sintetizar cada trecho. Trechos curtos
    # ("Perfeito," / "Papa!") tocam em meio segundo e o robô fica mudo esperando
    # o próximo. Aqui só cortamos depois de um mínimo de caracteres e apenas em
    # fim de frase/vírgula seguidos de espaço (não corta "3.5" nem "R$ 1,50").
    SEG_MIN_FIRST = 15   # primeiro trecho: começa a falar logo
    SEG_MIN_NEXT = 60    # demais trechos: tempo de fala cobre a síntese do próximo
    _SEG_FIRST_PUNCT = "，,、~。？?！!；;：:."
    _SEG_NEXT_PUNCT = "。？?！!；;：:."

    _LIGACAO = {
        "e", "mas", "que", "para", "pra", "porque", "quando", "com", "sem", "se",
        "ou", "então", "como", "pois", "enquanto", "onde", "até", "depois", "antes",
        "porém", "só", "também", "ainda", "em", "no", "na", "nos", "nas", "de",
        "do", "da", "dos", "das", "ao", "à", "por", "pelo", "pela",
    }
    CORTE_MIN = 18    # não corta antes disso (fala curta demais)
    CORTE_MAX = 45    # sem palavra de ligação, corta no último espaço depois disso

    def _corte_natural(self, texto: str) -> int:
        """Posição de corte (espaço antes da palavra de ligação), ou -1."""
        import re as _re

        if len(texto) < self.CORTE_MIN + 4:
            return -1
        # só palavras completas (seguidas de espaço) contam
        for m in _re.finditer(r"\s(\w+)(?=\s)", texto):
            pos = m.start()
            if pos < self.CORTE_MIN:
                continue
            if pos > self.CORTE_MAX:
                break
            if m.group(1).lower() in self._LIGACAO:
                return pos
        if len(texto) > self.CORTE_MAX + 5:
            pos = texto.rfind(" ", self.CORTE_MIN, self.CORTE_MAX + 1)
            return pos if pos > 0 else -1
        return -1

    def _get_segment_text(self) -> Optional[str]:
        full_text = "".join(self.tts_text_buff)
        current_text = full_text[self.processed_chars :]
        if not current_text:
            return None

        if self.is_first_sentence:
            punct, minimo = self._SEG_FIRST_PUNCT, self.SEG_MIN_FIRST
        else:
            punct, minimo = self._SEG_NEXT_PUNCT, self.SEG_MIN_NEXT

        cut_pos = -1
        for i, ch in enumerate(current_text):
            if ch not in punct or i + 1 < minimo:
                continue
            # pontuação ASCII só vale se já vier seguida de espaço/quebra
            if ch in ",.:;!?" :
                if i + 1 >= len(current_text) or not current_text[i + 1].isspace():
                    continue
            cand = self._quote_safe_cut(current_text, i, punct)
            if cand != -1:
                cut_pos = cand
                break

        # Primeiro trecho sem vírgula por perto: corta antes de uma palavra de
        # ligação ("e", "mas", "que", "para"...), onde uma pessoa respiraria.
        if cut_pos == -1 and self.is_first_sentence and not self.tts_stop_request:
            corte = self._corte_natural(current_text)
            if corte > 0:
                segment_text = textUtils.get_string_no_punctuation_or_emoji(current_text[:corte])
                if segment_text:
                    self.processed_chars += corte
                    self.is_first_sentence = False
                    return segment_text

        # Quebra de linha = fim de frase garantido (avisos curtos das ferramentas)
        nl = current_text.find("\n")
        if nl != -1 and current_text[:nl].strip() and (cut_pos == -1 or nl < cut_pos):
            cut_pos = nl

        if cut_pos != -1:
            segment_text_raw = current_text[: cut_pos + 1]
            segment_text = textUtils.get_string_no_punctuation_or_emoji(
                segment_text_raw
            )
            self.processed_chars += len(segment_text_raw)
            if self.is_first_sentence:
                self.is_first_sentence = False
            return segment_text
        elif self.tts_stop_request and current_text:
            self.is_first_sentence = True
            return current_text
        else:
            return None

    def _process_audio_file_stream(
        self, tts_file, callback: Callable[[Any], Any]
    ) -> None:
        """处理音频文件并转换为指定格式

        Args:
            tts_file: 音频文件路径
            callback: 文件处理函数
        """
        if str(tts_file).startswith(("http://", "https://")):
            # Automakaza: rádio/áudio online tocado ao vivo
            self._stream_url(tts_file, callback)
            return
        if tts_file.endswith(".p3"):
            p3.decode_opus_from_file_stream(tts_file, callback=callback)
        elif self.conn.audio_format == "pcm":
            self.audio_to_pcm_data_stream(tts_file, callback=callback)
        else:
            self.audio_to_opus_data_stream(tts_file, callback=callback)

        if (
            self.delete_audio_file
            and tts_file is not None
            and os.path.exists(tts_file)
            and tts_file.startswith(self.output_file)
        ):
            os.remove(tts_file)

    RETOMAR_ATE_S = 90  # só retoma se a interrupção foi há pouco tempo

    def _retomar_radio_se_preciso(self):
        import time as _time

        conn = self.conn
        info = getattr(conn, "radio_retomar", None)
        if not info or conn.client_abort or conn.stop_event.is_set():
            return
        # despedida ("tchau", "vai dormir"...): a conversa vai encerrar, a rádio não volta
        if getattr(conn, "close_after_chat", False):
            conn.radio_retomar = None
            logger.bind(tag=TAG).info("Despedida: a rádio não volta")
            return
        # sensor de presença: parando a rádio de propósito, ou é a própria pergunta
        # "tem alguém aí?" (a rádio só volta depois que alguém responder)
        if getattr(conn, "presenca_estado", None) == "parando":
            return
        sid_fim = getattr(self, "_sid_fim", None) or getattr(self, "current_sentence_id", None)
        if info.get("nao_no_sid") and info.get("nao_no_sid") == sid_fim:
            return
        if _time.time() - info.get("quando", 0) > self.RETOMAR_ATE_S:
            conn.radio_retomar = None
            return
        # A resposta terminou com uma PERGUNTA? Então espera o usuário responder;
        # a rádio volta no fim da próxima resposta (se ele não pedir outra coisa).
        resposta = "".join(self.tts_text_buff).strip()
        if resposta.endswith(("?", "？")):
            info["quando"] = _time.time()
            logger.bind(tag=TAG).info("Resposta com pergunta: rádio espera o usuário responder")
            return
        conn.radio_retomar = None
        nome = info.get("nome") or "a rádio"
        logger.bind(tag=TAG).info(f"Voltando a tocar: {nome}")
        # Atualiza a tela (só texto, sem falar): "Tocando <rádio>"
        self.tts_audio_queue.put(
            (SentenceType.FIRST, None, f"Tocando {nome}", getattr(self, "current_sentence_id", None))
        )
        self._stream_url(info["url"], self.handle_opus, nome=info.get("nome"))

    def _stream_url(self, url, callback, nome=None) -> None:
        """Toca um áudio da internet (rádio ao vivo ou arquivo) pelo ffmpeg.

        Para quando o usuário interrompe (palavra de ativação ou botão), quando a
        conexão fecha, quando começa outra resposta ou ao atingir o tempo máximo
        (plugins.play_radio.max_minutes; padrão 0 = sem limite, quem desliga a
        rádio sem ninguém por perto é o sensor de presença). Se a emissora cair
        no meio, reconecta sozinho (até 3 vezes seguidas).
        """
        import subprocess
        import time as _time

        conn = self.conn
        sr = conn.sample_rate
        sid = getattr(self, "current_sentence_id", None)
        cfg = conn.config.get("plugins", {}).get("play_radio", {}) or {}
        max_s = float(cfg.get("max_minutes", 0)) * 60
        # Nivela o volume da rádio com o da voz (loudnorm) + ajuste fino opcional
        # Nível da rádio: AUTOMÁTICO = igual ao volume medido da voz da Sophia.
        # (loudness: número fixo em LUFS desliga o automático)
        ganho = float(cfg.get("volume_db", 0))      # ajuste fino em dB (+ mais alto)
        voz = TTSProviderBase.nivel_da_voz()
        fixo = cfg.get("loudness", "auto")
        if isinstance(fixo, (int, float)):
            alvo = float(fixo)
            origem = "fixo"
        elif voz is not None:
            alvo = voz
            origem = f"igual à voz ({len(TTSProviderBase._voz_lufs)} medidas)"
        else:
            alvo = -16.0
            origem = "padrão (voz ainda não medida)"
        alvo = max(-40.0, min(-6.0, alvo + ganho))
        ganho = 0
        # Corta os graves que o alto-falante pequeno não reproduz: eles "gastam"
        # volume sem serem ouvidos e a música parece mais baixa que a voz.
        corte = float(cfg.get("highpass_hz", 150))
        filtro = f"highpass=f={corte}," if corte > 0 else ""
        filtro += f"loudnorm=I={alvo}:TP=-1.0:LRA=11"
        if ganho:
            filtro += f",volume={ganho}dB,alimiter=limit=0.95"
        cmd = [
            "ffmpeg", "-nostdin", "-loglevel", "error",
            "-reconnect", "1", "-reconnect_streamed", "1", "-reconnect_delay_max", "5",
            "-i", url, "-vn", "-af", filtro,
            "-f", "s16le", "-ac", "1", "-ar", str(sr), "-",
        ]
        enc = None
        if conn.audio_format != "pcm":
            enc = opus_encoder_utils.OpusEncoderUtils(
                sample_rate=sr, channels=1, frame_size_ms=60
            )
            # O codificador padrão é ajustado para VOZ (24 kbps). Para música:
            # mais bits e modo "música" (menos artefatos, agudos mais limpos).
            try:
                from opuslib_next import constants as _opus_c

                enc.encoder.bitrate = int(cfg.get("bitrate_kbps", 64)) * 1000
                enc.encoder.signal = _opus_c.SIGNAL_MUSIC
            except Exception as e:
                logger.bind(tag=TAG).warning(f"Não ajustei o Opus para música: {e}")
        frame_bytes = int(sr * 0.06) * 2
        logger.bind(tag=TAG).info(
            f"Tocando online: {url} | nível {alvo:.1f} LUFS, {origem} | filtro: {filtro} | {int(cfg.get('bitrate_kbps', 64))} kbps"
        )
        conn.radio_tocando = True
        t0 = _time.monotonic()
        tocado = 0.0
        tentativas = 0
        while True:
          proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          t_ini = _time.monotonic()
          tocado_ini = tocado
          motivo = "fim do áudio"
          try:
            while True:
                if conn.stop_event.is_set():
                    motivo = "conexão fechada"
                    break
                if conn.client_abort:
                    motivo = "interrompido pelo usuário"
                    break
                if sid and conn.sentence_id != sid:
                    motivo = "nova resposta"
                    break
                if max_s > 0 and _time.monotonic() - t0 > max_s:
                    motivo = "tempo máximo"
                    break
                chunk = proc.stdout.read(frame_bytes * 5)
                if not chunk:
                    break
                if enc:
                    enc.encode_pcm_to_opus_stream(chunk, False, callback)
                else:
                    callback(chunk)
                tocado += len(chunk) / 2 / sr
                # mantém a conexão viva enquanto toca
                conn.last_activity_time = _time.time() * 1000
                adiantado = tocado - (_time.monotonic() - t0)
                if adiantado > 2.0:
                    _time.sleep(adiantado - 2.0)
          except Exception as e:
            motivo = f"erro: {e}"
          finally:
            try:
                proc.kill()
            except Exception:
                pass
          # Rádio ao vivo caiu sozinha (emissora/rede): reconecta, sem encerrar
          ao_vivo = str(url).startswith("http") and tocado > 30
          if (motivo == "fim do áudio" or motivo.startswith("erro")) and ao_vivo and tentativas < 3:
              tentativas = tentativas + 1 if tocado - tocado_ini < 60 else 1
              logger.bind(tag=TAG).warning(
                  f"Rádio caiu ({motivo}) após {tocado:.0f} s: reconectando ({tentativas}/3)"
              )
              _time.sleep(2)
              # o relógio de ritmo recomeça na nova conexão
              t0 = _time.monotonic() - tocado + 2.0
              continue
          break
        if enc:
            try:
                enc.close()
            except Exception:
                pass
        conn.radio_tocando = False
        logger.bind(tag=TAG).info(f"Áudio online parou ({motivo}) após {tocado:.0f} s")
        # Interrompida pelo usuário: guarda para voltar depois do pedido rápido
        if motivo in ("interrompido pelo usuário", "nova resposta") and tocado > 1:
            conn.radio_retomar = {
                "url": url,
                "nome": nome or getattr(conn, "radio_nome", None),
                "quando": _time.time(),
            }
        else:
            conn.radio_retomar = None
        # Conexão caiu (ex.: Wi-Fi) com a rádio tocando: retoma quando reconectar
        if motivo == "conexão fechada" and tocado > 5 and str(url).startswith("http"):
            try:
                from plugins_func.functions.play_radio import registrar_queda

                registrar_queda(
                    getattr(conn, "device_id", None), url,
                    nome or getattr(conn, "radio_nome", None),
                )
            except Exception as e:
                logger.bind(tag=TAG).error(f"Não registrei a queda da rádio: {e}")

    def _process_before_stop_play_files(self):
        for audio_datas, text in self.before_stop_play_files:
            self.tts_audio_queue.put((SentenceType.MIDDLE, audio_datas, text, getattr(self, 'current_sentence_id', None)))
        self.before_stop_play_files.clear()
        self.tts_audio_queue.put((SentenceType.LAST, [], None, getattr(self, 'current_sentence_id', None)))

    def _process_remaining_text_stream(
        self, opus_handler: Callable[[bytes], None] = None
    ):
        """处理剩余的文本并生成语音

        Returns:
            bool: 是否成功处理了文本
        """
        full_text = "".join(self.tts_text_buff)
        remaining_text = full_text[self.processed_chars :]
        if remaining_text:
            segment_text = textUtils.get_string_no_punctuation_or_emoji(remaining_text)
            if segment_text:
                self.to_tts_stream(segment_text, opus_handler=opus_handler)
                self.processed_chars += len(full_text)
                return True
        return False

    def _apply_percentage_params(self, config):
        """根据子类定义的 TTS_PARAM_CONFIG 批量应用百分比参数"""
        for config_key, attr_name, min_val, max_val, base_val, transform in self.TTS_PARAM_CONFIG:
            if config_key in config:
                val = convert_percentage_to_range(config[config_key], min_val, max_val, base_val)
                setattr(self, attr_name, transform(val) if transform else val)

    def _match_stream_text(self, text):
        """流式文本滑动窗口匹配，用于处理跨分片的替换词

        Args:
            text: 输入的文本片段

        Returns:
            tuple: (确定的文本列表, 剩余待匹配的前缀)
        """
        if not self.correct_words or not text:
            return [text] if text else [], ""

        result = []
        pending = self._pending_prefix
        i = 0

        while i < len(text):
            char = text[i]

            # 尝试：pending + 当前字符 是否能匹配替换词
            test_text = pending + char

            matched = False
            # 遍历可能匹配的替换词
            candidates = self._words_by_first_char.get(pending[0], []) if pending else self._words_by_first_char.get(char, [])
            for key in candidates:
                if test_text == key:
                    # 完整匹配，替换后发送
                    result.append(self.correct_words[key])
                    pending = ""
                    matched = True
                    break
                elif key.startswith(test_text):
                    # 是替换词的前缀，继续等待
                    pending = test_text
                    matched = True
                    break

            if matched:
                i += 1
                continue

            # 没有匹配到更长的词，pending 的内容确定可以发送
            if pending:
                result.append(pending)
                pending = ""

            # 检查当前字符是否是某个替换词的开头
            if char in self._words_by_first_char:
                pending = char
            else:
                result.append(char)

            i += 1

        return result, pending

    def reset_stream_state(self):
        """重置流式处理状态，用于会话开始时清理残留状态"""
        self._pending_prefix = ""
